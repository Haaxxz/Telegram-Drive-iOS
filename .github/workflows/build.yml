name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project TelegramDrive.xcodeproj \
            -scheme TelegramDrive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned app as .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TelegramDrive.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload TelegramDrive.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDrive-ipa
          path: TelegramDrive.ipa
          if-no-files-found: error
